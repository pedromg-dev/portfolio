<header class="pt-header fixed top-0 inset-x-0 z-30 flex justify-center pointer-events-none" [class.is-scrolled]="isScrolled">
  <nav
    class="pt-sidebar pointer-events-auto flex flex-col lg:flex-row items-center justify-between w-full px-4 lg:px-6 py-2.5 border border-border dark:border-border-dark"
    aria-label="Primary Navigation">
    <div class="flex items-center justify-between w-full lg:w-auto">
      <a (click)="navigateTo('hero')"
        class="cursor-pointer font-mono text-sm font-semibold tracking-tight text-ink dark:text-ink-dark hover:text-accent dark:hover:text-accent-dark min-h-[44px] inline-flex items-center px-2">
        pedromg.dev
      </a>

      <div class="flex items-center gap-3 lg:hidden">
        <app-language-selector />
        <app-theme-switch class="flex items-center" />
        <button type="button"
          (click)="toggleMenu()"
          [class.opened]="isOpen"
          [attr.aria-expanded]="isOpen"
          aria-label="Menu"
          aria-controls="navbar-hamburger"
          class="menu min-h-[44px] min-w-[44px] inline-flex items-center justify-center rounded-lg text-ink dark:text-ink-dark hover:bg-surface-elevated dark:hover:bg-surface-dark-elevated focus:outline-none">
          <svg class="w-7 h-7" viewBox="0 0 100 100" aria-hidden="true">
            <path stroke="currentColor" class="line line1"
              d="M 20,29.000046 H 80.000231 C 80.000231,29.000046 94.498839,28.817352 94.532987,66.711331 94.543142,77.980673 90.966081,81.670246 85.259173,81.668997 79.552261,81.667751 75.000211,74.999942 75.000211,74.999942 L 25.000021,25.000058" />
            <path stroke="currentColor" class="line line2" d="M 20,50 H 80" />
            <path stroke="currentColor" class="line line3"
              d="M 20,70.999954 H 80.000231 C 80.000231,70.999954 94.498839,71.182648 94.532987,33.288669 94.543142,22.019327 90.966081,18.329754 85.259173,18.331003 79.552261,18.332249 75.000211,25.000058 75.000211,25.000058 L 25.000021,74.999942" />
          </svg>
        </button>
      </div>
    </div>

    <app-index-sidebar class="hidden lg:flex items-center" />

    <div class="hidden lg:flex items-center gap-4">
      <app-language-selector />
      <app-theme-switch class="flex items-center" />
    </div>

    @if (isOpen) {
      <div class="w-full lg:hidden pt-2 pb-1 border-t border-border dark:border-border-dark mt-2" id="navbar-hamburger">
        <ul class="flex flex-col gap-1 font-medium">
          <li>
            <a (click)="navigateTo('about-me')"
              class="cursor-pointer flex items-center justify-center min-h-[44px] px-3 rounded-lg text-ink dark:text-ink-dark hover:bg-surface-elevated dark:hover:bg-surface-dark-elevated">
              <span>{{'NavAbout' | translate }}</span>
            </a>
          </li>
          <li>
            <a (click)="navigateTo('skills')"
              class="cursor-pointer flex items-center justify-center min-h-[44px] px-3 rounded-lg text-ink dark:text-ink-dark hover:bg-surface-elevated dark:hover:bg-surface-dark-elevated">
              <span>{{'NavSkills' | translate }}</span>
            </a>
          </li>
          <li>
            <a (click)="navigateTo('work-experience')"
              class="cursor-pointer flex items-center justify-center min-h-[44px] px-3 rounded-lg text-ink dark:text-ink-dark hover:bg-surface-elevated dark:hover:bg-surface-dark-elevated">
              <span>{{'NavExperience' | translate }}</span>
            </a>
          </li>
          <li>
            <a (click)="navigateTo('projects')"
              class="cursor-pointer flex items-center justify-center min-h-[44px] px-3 rounded-lg text-ink dark:text-ink-dark hover:bg-surface-elevated dark:hover:bg-surface-dark-elevated">
              <span>{{'NavProjects' | translate }}</span>
            </a>
          </li>
          <li>
            <a (click)="navigateTo('contact')"
              class="cursor-pointer flex items-center justify-center min-h-[44px] px-3 rounded-lg text-ink dark:text-ink-dark hover:bg-surface-elevated dark:hover:bg-surface-dark-elevated">
              <span>{{'Contact' | translate }}</span>
            </a>
          </li>
        </ul>
      </div>
    }
  </nav>
</header>
