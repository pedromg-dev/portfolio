<article
  data-aos="fade-up"
  class="timeline-row group relative grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-0">

  <!-- Left column: Dates & Location (Desktop) -->
  <div class="hidden md:flex md:col-span-3 flex-col items-end text-right pr-8 pt-1.5 select-none">
    <span
      class="font-mono text-xs font-semibold uppercase tracking-wider px-2.5 py-1 rounded-md border"
      [class.bg-accent]="isCurrent"
      [class.text-surface]="isCurrent"
      [class.border-accent]="isCurrent"
      [class.dark:bg-accent-dark]="isCurrent"
      [class.dark:text-surface-dark]="isCurrent"
      [class.dark:border-accent-dark]="isCurrent"
      [class.bg-surface-elevated]="!isCurrent"
      [class.dark:bg-surface-dark-elevated]="!isCurrent"
      [class.text-ink]="!isCurrent"
      [class.dark:text-ink-dark]="!isCurrent"
      [class.border-border]="!isCurrent"
      [class.dark:border-border-dark]="!isCurrent">
      {{dates}}
    </span>
    @if (company) {
      <span class="mt-2 font-semibold text-sm text-ink dark:text-ink-dark">{{company}}</span>
    }
    <span class="mt-0.5 font-mono text-xs text-ink-muted dark:text-ink-dark-muted">
      {{localization}}
    </span>
  </div>

  <!-- Right column + Vertical chronological axis -->
  <div class="md:col-span-9 relative pl-8 md:pl-10" [class.pb-10]="!isLast" [class.pb-2]="isLast">
    <!-- Vertical connecting line -->
    @if (!isLast) {
      <span
        class="timeline-line absolute left-[11px] md:left-[-1px] top-3 bottom-0 w-[2px] bg-border dark:bg-border-dark"
        aria-hidden="true"></span>
    }

    <!-- Chronological node dot -->
    <span
      class="timeline-dot absolute left-[3px] md:left-[-9px] top-2 w-[18px] h-[18px] rounded-full flex items-center justify-center transition-transform duration-200 group-hover:scale-110"
      [class.is-current-dot]="isCurrent"
      aria-hidden="true">
      <span class="timeline-dot-inner w-2.5 h-2.5 rounded-full"></span>
    </span>

    <!-- Mobile Date & Location header -->
    <div class="flex flex-wrap items-center gap-2 mb-3 md:hidden">
      <span
        class="font-mono text-xs font-semibold uppercase tracking-wider px-2.5 py-1 rounded-md border"
        [class.bg-accent]="isCurrent"
        [class.text-surface]="isCurrent"
        [class.border-accent]="isCurrent"
        [class.dark:bg-accent-dark]="isCurrent"
        [class.dark:text-surface-dark]="isCurrent"
        [class.dark:border-accent-dark]="isCurrent"
        [class.bg-surface-elevated]="!isCurrent"
        [class.dark:bg-surface-dark-elevated]="!isCurrent"
        [class.text-ink]="!isCurrent"
        [class.dark:text-ink-dark]="!isCurrent"
        [class.border-border]="!isCurrent"
        [class.dark:border-border-dark]="!isCurrent">
        {{dates}}
      </span>
      <span class="font-mono text-xs text-ink-muted dark:text-ink-dark-muted">
        {{localization}}
      </span>
    </div>

    <!-- Role Details Card -->
    <div class="pt-item-timeline rounded-xl p-5 sm:p-6 bg-surface-elevated dark:bg-surface-dark-elevated border border-border dark:border-border-dark transition-colors duration-200">
      <div class="flex flex-col sm:flex-row sm:items-baseline justify-between gap-2 pb-3 border-b border-border dark:border-border-dark">
        <div class="flex flex-col gap-1">
          <div class="flex flex-wrap items-center gap-2.5">
            <h3 class="text-lg sm:text-xl font-bold text-ink dark:text-ink-dark">
              {{title}}
            </h3>
            @if (company) {
              <span class="text-sm font-medium text-accent dark:text-accent-dark">
                &#64; {{company}}
              </span>
            }
          </div>
          @if (subtitle) {
            <p class="font-mono text-xs text-ink-muted dark:text-ink-dark-muted">
              {{subtitle}}
            </p>
          }
        </div>
      </div>

      @if (description) {
        <p class="mt-4 text-sm sm:text-base text-ink dark:text-ink-dark leading-relaxed">
          {{description}}
        </p>
      }

      <ng-content select="[additionalInfo]"></ng-content>
      <ng-content select="[logosSection]"></ng-content>
    </div>
  </div>
</article>
