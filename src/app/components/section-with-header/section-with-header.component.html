<section id="{{this.id}}" class="py-16 lg:py-24">
  <div class="container max-w-5xl px-5 md:px-6 mx-auto" data-aos="fade-up" data-aos-offset="100" data-aos-duration="450">
    <div class="flex flex-col gap-10">
      <div class="flex flex-col items-start gap-3">
        <span class="w-10 h-0.5 bg-accent dark:bg-accent-dark rounded-full"></span>
        <div class="text-2xl sm:text-3xl font-bold tracking-tight text-ink dark:text-ink-dark">
          <ng-content select="[headerSection]"></ng-content>
        </div>
      </div>

      <div class="min-w-0">
        <ng-content select="[bodySection]"></ng-content>
      </div>
    </div>
  </div>
</section>
