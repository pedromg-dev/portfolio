<article class="flex flex-col h-full bg-surface-elevated dark:bg-surface-dark-elevated border border-border dark:border-border-dark rounded-xl overflow-hidden transition-colors duration-200 hover:border-border-strong dark:hover:border-border-dark-strong">
  <img class="w-full h-48 object-cover border-b border-border dark:border-border-dark" src="{{projectImageUrl}}" alt="{{projectName}}" />
  <div class="p-6 flex flex-col flex-1 justify-between gap-4">
    <div class="flex flex-col gap-2">
      <h3 class="text-xl font-semibold text-ink dark:text-ink-dark">
        {{projectName}}
      </h3>
      <p class="text-base text-ink-muted dark:text-ink-dark-muted leading-relaxed">
        {{projectDescription}}
      </p>
    </div>

    <div class="flex flex-col gap-4">
      <ng-content select="[logosSection]"></ng-content>

      <div class="flex justify-end pt-2">
        <a href="{{projectRepositoryUrl}}" target="_blank" rel="noopener noreferrer"
          class="min-h-[44px] inline-flex items-center px-4 py-2 text-sm font-medium text-surface dark:text-surface-dark bg-ink dark:bg-ink-dark rounded-lg hover:bg-accent dark:hover:bg-accent-dark transition-colors">
          {{'Repository' | translate}}
          <svg class="rtl:rotate-180 w-3.5 h-3.5 ms-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
            fill="none" viewBox="0 0 14 10">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M1 5h12m0 0L9 1m4 4L9 9" />
          </svg>
        </a>
      </div>
    </div>
  </div>
</article>
