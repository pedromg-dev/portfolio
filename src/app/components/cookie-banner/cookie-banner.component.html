@if (showBanner) {
  <aside
    role="dialog"
    aria-labelledby="cookie-banner-title"
    aria-describedby="cookie-banner-desc"
    class="fixed bottom-4 inset-x-4 sm:inset-x-auto sm:right-6 sm:max-w-md z-50 animate-fade-in">
    <div class="p-6 rounded-2xl bg-surface-elevated/95 dark:bg-surface-dark-elevated/95 backdrop-blur-md shadow-2xl text-ink dark:text-ink-dark flex flex-col gap-4">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <span class="w-8 h-8 rounded-xl bg-accent/15 text-accent dark:text-accent-dark flex items-center justify-center flex-none">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5" />
              <path d="M8.5 8.5v.01" />
              <path d="M7 15v.01" />
              <path d="M11 12v.01" />
              <path d="M16 16v.01" />
            </svg>
          </span>
          <h2 id="cookie-banner-title" class="font-bold text-sm sm:text-base text-ink dark:text-ink-dark">
            {{ 'CookieBanner.Title' | translate }}
          </h2>
        </div>
      </div>

      <p id="cookie-banner-desc" class="text-xs sm:text-sm text-ink-muted dark:text-ink-dark-muted leading-relaxed">
        {{ 'CookieBanner.Desc' | translate }}
      </p>

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5 pt-1">
        <a
          (click)="goToCookiesPolicy()"
          class="cursor-pointer text-xs font-semibold text-accent dark:text-accent-dark hover:underline text-center sm:text-left py-1">
          {{ 'CookieBanner.LearnMore' | translate }}
        </a>

        <div class="flex items-center gap-2">
          <button
            type="button"
            (click)="acceptTechnicalOnly()"
            class="flex-1 sm:flex-none px-3.5 py-2 rounded-xl text-xs font-semibold bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark hover:bg-surface-subtle transition shadow-xs">
            {{ 'CookieBanner.RejectOptional' | translate }}
          </button>
          <button
            type="button"
            (click)="acceptAll()"
            class="flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs font-semibold bg-accent text-white dark:bg-accent-dark dark:text-surface-dark hover:opacity-90 transition shadow-xs">
            {{ 'CookieBanner.Accept' | translate }}
          </button>
        </div>
      </div>
    </div>
  </aside>
}
