<button
  type="button"
  (click)="switchTheme()"
  [class.is-dark]="isDark"
  [class.is-light]="!isDark"
  [class.pulse-burst]="isAnimating"
  [attr.aria-label]="isDark ? 'Switch to light theme' : 'Switch to dark theme'"
  [attr.aria-pressed]="isDark"
  class="theme-orb-btn min-w-[44px] min-h-[44px] relative inline-flex items-center justify-center rounded-xl border border-border/75 dark:border-border-dark/75 bg-surface/75 dark:bg-surface-dark-elevated/75 backdrop-blur-md shadow-xs overflow-hidden">

  <span class="theme-glow" aria-hidden="true"></span>

  <span class="icon-stage relative w-6 h-6 flex items-center justify-center" aria-hidden="true">
    <!-- Sun Icon (Light Mode) -->
    <svg class="sun-svg absolute inset-0 w-6 h-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle class="sun-core" cx="12" cy="12" r="4.5" fill="currentColor" />
      <g class="sun-rays" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="12" y1="2.25" x2="12" y2="4.25" />
        <line x1="12" y1="19.75" x2="12" y2="21.75" />
        <line x1="4.25" y1="12" x2="2.25" y2="12" />
        <line x1="21.75" y1="12" x2="19.75" y2="12" />
        <line x1="5.8" y1="5.8" x2="4.4" y2="4.4" />
        <line x1="19.6" y1="19.6" x2="18.2" y2="18.2" />
        <line x1="18.2" y1="5.8" x2="19.6" y2="4.4" />
        <line x1="4.4" y1="19.6" x2="5.8" y2="18.2" />
      </g>
    </svg>

    <!-- Moon & Stars Icon (Dark Mode) -->
    <svg class="moon-svg absolute inset-0 w-6 h-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        class="moon-body"
        d="M20.2 14.4A8.2 8.2 0 0 1 9.6 3.8a8.2 8.2 0 1 0 10.6 10.6Z"
        fill="currentColor" />
      <circle class="moon-star star-1" cx="18.5" cy="5.5" r="1" fill="currentColor" />
      <circle class="moon-star star-2" cx="15" cy="8.5" r="0.75" fill="currentColor" />
    </svg>
  </span>
</button>
