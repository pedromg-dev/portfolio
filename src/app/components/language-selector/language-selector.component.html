<div class="flex">
  <button id="dropdownDefaultButton"
    class="min-h-[44px] px-3 rounded-lg inline-flex items-center gap-2 text-sm font-medium text-ink-muted dark:text-ink-dark-muted hover:text-ink dark:hover:text-ink-dark hover:bg-surface-elevated dark:hover:bg-surface-dark-elevated transition-colors"
    type="button" (click)="changeLanguage()">
    @if(this.isEnglish) {
      <img src="assets/images/spanish-flag-icon.png" alt="Español" class="w-4 h-4 object-contain" />
      <span>ES</span>
    }
    @else {
      <img src="assets/images/united-kingdom-flag-icon.png" alt="English" class="w-4 h-4 object-contain" />
      <span>EN</span>
    }
  </button>
</div>
