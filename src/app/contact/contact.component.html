<app-section-with-header id="contact">
  <div headerSection>
    <h2>{{'Contact' | translate }}</h2>
  </div>
  <div bodySection>
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit($event)" class="flex flex-col gap-6">
      <!-- Gemini AI Email Draft Assistant -->
      <div class="p-5 rounded-xl bg-surface-elevated dark:bg-surface-dark-elevated border border-border dark:border-border-dark flex flex-col gap-3">
        <div class="flex items-center justify-between gap-2">
          <span class="font-mono text-xs uppercase tracking-wider text-accent dark:text-accent-dark">
            {{ 'AIAssistantTitle' | translate }}
          </span>
          <span class="font-mono text-[11px] text-ink-muted dark:text-ink-dark-muted">
            Gemini AI
          </span>
        </div>

        <p class="text-xs sm:text-sm text-ink-muted dark:text-ink-dark-muted">
          {{ 'AIAssistantSubtitle' | translate }}
        </p>

        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            (click)="applyQuickPrompt('AIPresetRecruiter')"
            [disabled]="isGeneratingAI"
            class="min-h-[36px] px-3 py-1.5 text-xs font-medium rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark hover:border-accent dark:hover:border-accent-dark transition-colors">
            {{ 'AIPresetRecruiterLabel' | translate }}
          </button>
          <button
            type="button"
            (click)="applyQuickPrompt('AIPresetProject')"
            [disabled]="isGeneratingAI"
            class="min-h-[36px] px-3 py-1.5 text-xs font-medium rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark hover:border-accent dark:hover:border-accent-dark transition-colors">
            {{ 'AIPresetProjectLabel' | translate }}
          </button>
          <button
            type="button"
            (click)="applyQuickPrompt('AIPresetNetworking')"
            [disabled]="isGeneratingAI"
            class="min-h-[36px] px-3 py-1.5 text-xs font-medium rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-ink dark:text-ink-dark hover:border-accent dark:hover:border-accent-dark transition-colors">
            {{ 'AIPresetNetworkingLabel' | translate }}
          </button>
        </div>

        <div class="flex flex-col sm:flex-row gap-2.5 pt-1">
          <input
            type="text"
            formControlName="aiPrompt"
            (keydown.enter)="$event.preventDefault(); generateEmailWithAI()"
            placeholder="{{ 'AIPromptPlaceholder' | translate }}"
            class="min-h-[44px] flex-1 bg-surface dark:bg-surface-dark border border-border dark:border-border-dark focus:border-accent dark:focus:border-accent-dark focus:outline-none text-ink dark:text-ink-dark text-sm rounded-lg px-3.5 py-2 transition-colors" />

          <button
            type="button"
            (click)="generateEmailWithAI()"
            [disabled]="isGeneratingAI || !contactForm.get('aiPrompt')?.value?.trim()"
            class="min-h-[44px] px-4 py-2 text-sm font-medium rounded-lg bg-accent text-surface hover:bg-accent-hover dark:bg-accent-dark dark:text-surface-dark dark:hover:bg-accent-dark-hover disabled:opacity-50 inline-flex items-center justify-center gap-2 transition-colors shrink-0">
            @if (isGeneratingAI) {
              <span class="w-4 h-4 rounded-full border-2 border-current border-t-transparent animate-spin"></span>
              <span>{{ 'AIGeneratingButton' | translate }}</span>
            } @else {
              <span>{{ 'AIGenerateButton' | translate }}</span>
            }
          </button>
        </div>

        @if (aiError) {
          <p class="text-xs text-accent dark:text-accent-dark">{{ aiError }}</p>
        }
      </div>

      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-medium text-ink dark:text-ink-dark">{{'Email' | translate}}</label>
        <input id="email" type="email" formControlName="email" placeholder="{{'MailExample'| translate}}"
          class="min-h-[44px] bg-surface-elevated dark:bg-surface-dark-elevated border border-border dark:border-border-dark focus:border-accent dark:focus:border-accent-dark focus:outline-none text-ink dark:text-ink-dark text-sm rounded-lg block w-full px-3.5 py-2.5 transition-colors"
          required>
      </div>

      <div class="flex flex-col gap-2">
        <label for="subject" class="text-sm font-medium text-ink dark:text-ink-dark">{{'Subject' | translate}}</label>
        <input id="subject" type="text" formControlName="subject"
          class="min-h-[44px] bg-surface-elevated dark:bg-surface-dark-elevated border border-border dark:border-border-dark focus:border-accent dark:focus:border-accent-dark focus:outline-none text-ink dark:text-ink-dark text-sm rounded-lg block w-full px-3.5 py-2.5 transition-colors"
          required>
      </div>

      <div class="flex flex-col gap-2">
        <label for="message" class="text-sm font-medium text-ink dark:text-ink-dark">{{'Message' | translate}}</label>
        <textarea id="message" formControlName="message" rows="5"
          class="bg-surface-elevated dark:bg-surface-dark-elevated border border-border dark:border-border-dark focus:border-accent dark:focus:border-accent-dark focus:outline-none text-ink dark:text-ink-dark text-sm rounded-lg block w-full p-3.5 transition-colors"
          placeholder="{{'LeaveAComment' | translate}}"></textarea>
      </div>

      <div class="flex flex-wrap items-center gap-4 pt-2">
        <button type="submit"
          class="min-h-[44px] px-6 py-2.5 text-sm font-medium rounded-lg bg-ink text-surface hover:bg-accent dark:bg-ink-dark dark:text-surface-dark dark:hover:bg-accent-dark transition-colors">
          {{'SendMessage' | translate}}
        </button>

        <div *ngIf="showNotificationEmailSent" id="alert-email-sent" (click)="closeNotificationEmailSent()"
          class="flex items-center gap-3 px-4 py-2.5 min-h-[44px] text-ink dark:text-ink-dark rounded-lg bg-surface-elevated dark:bg-surface-dark-elevated border border-border dark:border-border-dark"
          role="alert" [@fadeInOut]>
          <svg class="flex-shrink-0 w-4 h-4 text-accent dark:text-accent-dark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
            fill="currentColor" viewBox="0 0 20 20">
            <path
              d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z" />
          </svg>
          <span class="sr-only">Info</span>
          <div class="text-sm font-medium">
            {{'EmailSentSuccessfully' | translate }}
          </div>
          <button type="button"
            class="ms-auto text-ink-muted hover:text-ink dark:text-ink-dark-muted dark:hover:text-ink-dark rounded-lg inline-flex items-center justify-center min-h-[36px] min-w-[36px]"
            aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 14 14">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
            </svg>
          </button>
        </div>
      </div>
    </form>
  </div>
</app-section-with-header>
