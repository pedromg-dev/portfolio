<div class="container max-w-5xl mx-auto px-5 md:px-6">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
    <div class="lg:col-span-5 flex justify-center lg:justify-end order-1 lg:order-2">
      <div class="relative w-64 sm:w-72 lg:w-80 xl:w-[22rem] max-w-full">
        <img
          src="assets/images/my-profile-picture.png"
          class="hero-portrait-mask w-full h-auto object-contain mx-auto block drop-shadow-md select-none pointer-events-none"
          alt="Pedro Antonio Moya García" />
      </div>
    </div>

    <div class="lg:col-span-7 flex flex-col items-center lg:items-start text-center lg:text-left gap-4 order-2 lg:order-1">
      <span class="font-mono text-xs uppercase tracking-widest px-3 py-1.5 rounded-full bg-surface dark:bg-surface-dark-elevated text-accent dark:text-accent-dark border border-border dark:border-border-dark shadow-xs">
        {{'HeroLocationBadge' | translate}}
      </span>

      <h1 class="text-3xl sm:text-5xl lg:text-6xl font-bold tracking-tight text-ink dark:text-ink-dark leading-[1.08]">
        Pedro Antonio Moya García
      </h1>

      <h2 class="text-xl sm:text-2xl lg:text-3xl font-semibold text-ink dark:text-ink-dark">
        {{'FullStackDeveloper' | translate}}
      </h2>

      <p class="font-mono text-xs sm:text-sm text-ink-muted dark:text-ink-dark-muted">
        {{'HeroHeadlineTags' | translate}}
      </p>

      <div class="flex flex-wrap items-center justify-center lg:justify-start gap-4 pt-3">
        <app-pdf-downloader />
        <app-social-media />
      </div>
    </div>
  </div>
</div>
